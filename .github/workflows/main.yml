name: Build ColorOS Clean APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 定位项目根目录
        id: locate
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE" -name "settings.gradle.kts" -type f | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "未找到 settings.gradle.kts"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "项目根目录: $PROJECT_ROOT"

      - name: 安装 Android SDK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" -o cmdtools.zip
          python3 -c "import zipfile; zipfile.ZipFile('cmdtools.zip').extractall('$HOME/android-sdk/cmdline-tools')"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          chmod -R +x "$HOME/android-sdk/cmdline-tools/latest/bin/"

          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH"
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 安装 Gradle 8.10.2
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          cd /tmp
          curl -sL "https://services.gradle.org/distributions/gradle-8.10.2-bin.zip" -o gradle.zip
          python3 -c "import zipfile; zipfile.ZipFile('gradle.zip').extractall('$HOME/')"
          chmod -R +x "$HOME/gradle-8.10.2/bin/"

          export PATH="$HOME/gradle-8.10.2/bin:$PATH"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: 生成 gradlew 包装器
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle wrapper --gradle-version 8.10.2

      - name: 编译 Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorOSJing-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
