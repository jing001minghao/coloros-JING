name: Build ColorOS Clean APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 构建 APK
        run: |
          set -eu

          PROJECT_ROOT="."
          FOUND=$(find . -name "settings.gradle.kts" -type f -print -quit)
          [ -n "$FOUND" ] && PROJECT_ROOT=$(dirname "$FOUND")
          echo "==> 项目根目录: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          SDK_ROOT="$HOME/android-sdk"
          if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "==> 安装 Android SDK..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o /tmp/sdk.zip
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/sdk.zip').extractall('$SDK_ROOT/cmdline-tools')"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            chmod -R +x "$SDK_ROOT/cmdline-tools/latest/bin"
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "==> 安装 SDK platforms & build-tools..."
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
            sdkmanager --sdk_root="$ANDROID_HOME" \
              "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

          GRADLE_HOME="$HOME/gradle-8.7"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            echo "==> 安装 Gradle 8.7..."
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
              -o /tmp/gradle.zip
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/gradle.zip').extractall('$HOME')"
            chmod -R +x "$GRADLE_HOME/bin"
          fi
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle --version

          echo "==> 编译..."
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorOSJing-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
